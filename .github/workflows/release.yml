name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── React / Vite client ────────────────────────────────────────────
  client:
    name: Client – Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set up client environment
        run: cp .env.example .env

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ── Django server ──────────────────────────────────────────────────
  server:
    name: Server – Check & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nmpralekh
          POSTGRES_USER: mis_user
          POSTGRES_PASSWORD: NMPralekh
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up Django environment and settings
        run: |
          cp .env.example .env
          cp config/settings.example.py config/settings.py
          cp config/wsgi.example.py config/wsgi.py

      - name: Set up and configure Redis & pgBouncer
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq redis-tools pgbouncer postgresql-client
          redis-cli CONFIG SET maxmemory 512mb
          redis-cli CONFIG SET maxmemory-policy allkeys-lru
          sudo mkdir -p /etc/pgbouncer /var/log/pgbouncer /var/run/pgbouncer
          echo '"mis_user" "NMPralekh"' | sudo tee /etc/pgbouncer/userlist.txt
          sudo cp config/pgbouncer.example.ini /etc/pgbouncer/pgbouncer.ini
          sudo sed -i 's/auth_type = scram-sha-256/auth_type = trust/' /etc/pgbouncer/pgbouncer.ini
          sudo chown -R pgbouncer:pgbouncer /etc/pgbouncer /var/log/pgbouncer /var/run/pgbouncer
          sudo chmod 600 /etc/pgbouncer/userlist.txt
          sudo systemctl restart pgbouncer || sudo -u pgbouncer pgbouncer -d /etc/pgbouncer/pgbouncer.ini
          sleep 2
          pg_isready -h 127.0.0.1 -p 6432

      - name: Django system check
        run: python manage.py check

      - name: Run Django tests
        run: python manage.py test --verbosity=1

  # ── Android client ─────────────────────────────────────────────────
  android-client:
    name: Android – Assemble Debug
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-client

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug
